kicker: PIE & DOUGHNUT
title: pie-exploded
subtitle: Share of a whole with every wedge pulled apart, when the parts matter more than the mass
section: Pie & Doughnut
notes: 'pie-exploded — XL_CHART_TYPE.PIE_EXPLODED. Writes a series-level

  <c:explosion val="25"/> — every wedge pulls apart uniformly, not just a

  highlighted one; highlight''s second accent is still the only per-wedge callout.

  '
place:
