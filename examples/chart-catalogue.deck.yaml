        Contract: 4
    - category: Finance & Ops
      values:
        Full-time: 10
        Contract: 3
---
kicker: BAR & COLUMN
title: bar-stacked-100
subtitle: A headcount mix by team, independent of how big each team is
section: Bar & Column
notes: 'bar-stacked-100 — XL_CHART_TYPE.BAR_STACKED_100. Same normalization as

  column-stacked-100, horizontal.

  '
place:
- at: {cols: full}
  chart:
    kind: bar-stacked-100
