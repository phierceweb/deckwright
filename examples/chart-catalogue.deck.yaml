theme: base
title: deckwright Chart Catalogue
sections:
- Bar & Column
- Line
- Area
- Pie & Doughnut
- Radar
- XY & Bubble
out: ../out/chart-catalogue/deckwright Chart Catalogue.pptx
---
background: inverse
kicker: JULY 2026
title: The deckwright Chart Catalogue
subtitle: Every chart type the native renderer can build, one per slide
notes: '29 types across 6 families. Each slide names the exact type: field and

  explains what it is for, not what it is called — the wording to reuse when

  picking a chart, not a repeat of the title.

  '
---
background: inverse
kicker: PART 1 OF 6
title: Bar & Column
subtitle: One number per category, compared side by side or stacked.
section: Bar & Column
notes: Six types — clustered, stacked, and normalized, in both orientations.
---
kicker: BAR & COLUMN
title: bar
subtitle: Comparing a handful of long-labeled categories — horizontal bars keep names readable
section: Bar & Column
notes: 'bar — XL_CHART_TYPE.BAR_CLUSTERED. Has axes and gap_width; categories run

  down the side rather than along the bottom.

  '
place:
- at: {cols: full}
  chart:
    kind: bar
    data:
    - category: North America
      value: 82
      highlight: true
    - category: Europe
      value: 64
    - category: APAC
      value: 51
    - category: LATAM
      value: 28
---
kicker: BAR & COLUMN
title: column
subtitle: The default comparison — one number per category, read left to right
section: Bar & Column
notes: 'column — XL_CHART_TYPE.COLUMN_CLUSTERED. The plain case every other

  bar/column variant below is a variation on.

  '
place:
- at: {cols: full}
  chart:
    kind: column
    data:
    - category: Q1
      value: 120
    - category: Q2
      value: 180
    - category: Q3
      value: 240
    - category: Q4
      value: 300
      highlight: true
---
kicker: BAR & COLUMN
title: column-stacked
subtitle: Share of a total over time, when the total also matters
section: Bar & Column
notes: 'column-stacked — XL_CHART_TYPE.COLUMN_STACKED. Same axes and gap_width as

  a clustered column; series stack instead of sitting side by side.

  '
place:
- at: {cols: full}
  chart:
    kind: column-stacked
    data:
    - category: Q1
      values:
        Ads: 20
        Organic: 15
    - category: Q2
      values:
        Ads: 28
        Organic: 22
    - category: Q3
      values:
        Ads: 35
        Organic: 30
    - category: Q4
      values:
        Ads: 42
        Organic: 41
---
kicker: BAR & COLUMN
title: column-stacked-100
subtitle: The shifting mix across categories, once the total stops being the point
section: Bar & Column
notes: 'column-stacked-100 — XL_CHART_TYPE.COLUMN_STACKED_100. Every bar sums to

  100%, so a reader compares proportion, not absolute size.

  '
place:
- at: {cols: full}
  chart:
    kind: column-stacked-100
    data:
    - category: Q1
      values:
        Desktop: 70
        Mobile: 30
    - category: Q2
      values:
        Desktop: 60
        Mobile: 40
    - category: Q3
      values:
        Desktop: 50
        Mobile: 50
    - category: Q4
      values:
        Desktop: 40
        Mobile: 60
    unit: '%'
---
kicker: BAR & COLUMN
title: bar-stacked
subtitle: A stacked total for categories with long labels, breakdown intact
section: Bar & Column
notes: 'bar-stacked — XL_CHART_TYPE.BAR_STACKED. Same trap as column-stacked, drawn

  horizontally for labels too long to fit under a column.

  '
place:
- at: {cols: full}
  chart:
    kind: bar-stacked
    data:
    - category: Customer Support
      values:
        Full-time: 18
