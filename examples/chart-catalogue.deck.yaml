background: inverse
kicker: PART 6 OF 6
title: XY & Bubble
subtitle: A different data shape — a point is (x, y), or (x, y, size), not one number per category.
section: XY & Bubble
notes: Seven types — five scatter variants and two bubble variants. No categories field; every point
  carries its own x-value.
---
kicker: XY & BUBBLE
title: xy-scatter
subtitle: Two measures against each other, to see whether they move together — no line connects the
  points, so clusters and outliers stay visible
section: XY & Bubble
notes: 'xy-scatter — XL_CHART_TYPE.XY_SCATTER. Points are (x, y) pairs, not one

  value per category — categories: is forbidden on this shape. Has both axes,

  no gap_width, per-point fill all work like any other axis chart.

  '
place:
- at: {cols: full}
  chart:
    kind: xy-scatter
    data:
    - x: 12
      y: 38
    - x: 18
      y: 52
    - x: 22
      y: 58
    - x: 25
      y: 61
    - x: 31
      y: 74
    - x: 40
      y: 88
---
kicker: XY & BUBBLE
