background: inverse
kicker: PART 5 OF 6
title: Radar
subtitle: Several comparable traits at once — a shape, not a size.
section: Radar
notes: Three types — plain, filled, and marked, all needing one shared scale.
---
kicker: RADAR
title: radar
subtitle: Comparing things across several comparable traits at once — reads as a shape, not a size
section: Radar
notes: 'radar — XL_CHART_TYPE.RADAR. Its major gridlines are the rings and spokes

  the shape is plotted against — the one family _style_axes leaves at

  python-pptx''s own default instead of driving from theme.chart.grid. Needs

  every series on one comparable scale, or the smaller one collapses to the

  centre.

  '
place:
- at: {cols: full}
  chart:
    kind: radar
    data:
    - category: Speed
      values:
        Model A: 4
        Model B: 3
    - category: Range
