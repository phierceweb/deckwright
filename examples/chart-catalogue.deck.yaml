    unit: '%'
---
background: inverse
kicker: PART 2 OF 6
title: Line
subtitle: A trend over time — plain, marked, stacked, or normalized.
section: Line
notes: Six types — the line family carries as many variants as bar/column.
---
kicker: LINE
title: line
subtitle: A single trend over time — the plain case, one line, no fill
section: Line
notes: 'line — XL_CHART_TYPE.LINE. Has axes, no gap_width; the stroke alone

