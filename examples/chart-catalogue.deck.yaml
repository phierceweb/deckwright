background: inverse
kicker: PART 4 OF 6
title: Pie & Doughnut
subtitle: Share of a single whole — no axis to misread.
section: Pie & Doughnut
notes: Four types — plain and exploded, wedge and ring.
---
kicker: PIE & DOUGHNUT
title: pie
subtitle: A single moment's share of a whole — plain wedges, best kept to a handful of slices
section: Pie & Doughnut
notes: 'pie — XL_CHART_TYPE.PIE. No category or value axis; one series, coloured

  and named per wedge.

  '
place:
- at: {cols: full}
  chart:
    kind: pie
    data:
    - category: Direct
      value: 38
      highlight: true
    - category: Referral
      value: 27
    - category: Paid
      value: 21
    - category: Organic
      value: 14
    unit: '%'
---
kicker: PIE & DOUGHNUT
title: doughnut
subtitle: The same share-of-whole as pie, with a center hole that leaves room for a total or a mark
section: Pie & Doughnut
notes: 'doughnut — XL_CHART_TYPE.DOUGHNUT. Same per-point palette and

  category-name labels as pie; no axes to style.

  '
place:
