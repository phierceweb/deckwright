kicker: SPEC
title: Two teams, five capabilities
subtitle: A radar compares shape, not size — it reads when the series are on one scale
section: Spec
notes: 'radar — XL_CHART_TYPE.RADAR. Its plot has no gap_width, and its major

  gridlines are the rings and spokes the shape is plotted against — the one

  type _style_axes leaves at python-pptx''s own default instead of driving

  from the theme.


  The two series are deliberately close in magnitude. A radar whose series

  differ by an order of magnitude collapses the smaller one onto the centre

  point, which says nothing about either.

  '
