theme: base
title: deckwright
sections:
- Chrome
- Theme
- Spec
- QA
out: ../out/feature-tour/deckwright Feature Tour.pptx
---
background: inverse
kicker: THE FEATURE TOUR
title: deckwright
subtitle: Decks compiled from a spec, not assembled by hand
chrome:
  kicker: {at: {box: {x: 5.5%, y: 52%, w: 50%, h: 5%}}, anchor: bottom}
  title: {at: {box: {x: 5.5%, y: 57%, w: 75%, h: 14%}}, rung: display, anchor: bottom}
  subtitle: {at: {box: {x: 5.5%, y: 72%, w: 60%, h: 6%}}, anchor: top}
notes: 'Every slide after this one was produced by `deckwright build` from a single

  YAML file, and no Python at all — every body on it is a component that ships.

  '
---
background: inverse
kicker: PART 1 OF 4
title: Chrome
subtitle: The frame that repeats on every slide, written once.
section: Chrome
notes: Act one — what a slide is made of.
---
kicker: CHROME
title: A slide has no layout
subtitle: Four optional fields, a backdrop, and a list of placements — that is the whole shape
section: Chrome
notes: 'There is no layout: key. A slide names the text it carries, the backdrop it sits

  on, and what to place where. Every position and size comes from the theme.

  '
animate: one_at_a_time
place:
- at: {cols: full}
  callouts:
    items:
    - head: 'kicker, title, subtitle'
      body: The chrome. Every field is optional; an absent field draws nothing at all.
    - head: 'background:'
      body: page, inverse, or an image — and it picks the contrast-checked colour pair the text uses.
    - head: 'place:'
      body: One entry per component, each saying where it goes and what it draws.
    - head: 'extends:'
      body: A Python module registering components of its own, for what the spec cannot say.
---
kicker: CHROME
title: Nothing here is hand-positioned
subtitle: Every number below comes out of the theme, not out of a build script
section: Chrome
notes: 'None of these values appear in the deck spec. The theme owns colour, type and

  the space content may occupy; the spec says only what goes where.

  '
place:
- at: {cols: full}
  stats:
    items:
    - value: '0'
      label: inches hand-computed
    - value: '12'
      label: semantic colour roles
    - value: '10'
      label: rungs on the type ramp
    - value: '5'
      label: components in the vocabulary
    caption: The spec says what goes where. The theme owns every colour, size and inch.
---
background: inverse
kicker: PART 2 OF 4
title: Theme
subtitle: One source of truth for colour, type, and the space content may occupy.
section: Theme
notes: Act two — the theme.
---
kicker: THEME
title: The palette binds onto the template
subtitle: Semantic roles bind onto slots in the .pptx's own clrScheme — edit the template, the deck
  follows
section: Theme
notes: 'A bind: never lists a hex value. It says ink -> dk1, accent-1 -> accent1.

  The loader opens the template and reads what those slots actually are, so the

  YAML cannot drift from the brand file.

  '
place:
- at: {cols: full, rows: {from: 0, to: 8}}
  swatches:
    roles:
    - ink
    - accent-1
    - accent-2
    - accent-3
    - muted
    - line
    caption: Every value above was read out of the .pptx at build time.
- at: {cols: full, rows: {from: 8, to: 12}}
  split:
  - card:
      pair: accent-1
      heading: accent-1
      body: A ground, and ink checked against it.
  - card:
      pair: accent-2
      heading: accent-2
      body: The pair supplies the ink.
  - card:
      pair: accent-3
      heading: accent-3
      body: Every pair clears WCAG AA.
  - card:
      pair: inverse
      heading: inverse
      body: Below AA fails qa, never ships.
---
kicker: THEME
title: The grid every placement resolves against
subtitle: Drawn below by asking the theme for its own measurements — and any region it reserves
section: Theme
notes: 'The bars are the theme''s own columns, read from the theme rather than drawn to

  a fixed number. A theme that declares a reserved region — a logo wedge a brand keeps

  clear — has it laid over them as its real polygon, and a placement intruding on it

  fails the geometry check. The base theme declares none, so this slide shows columns

  alone.

  '
place:
- at: {cols: full, rows: {from: 0, to: 6}}
  grid: {show: columns}
- at: {cols: full, rows: {from: 6, to: 12}}
  callouts:
    items:
    - head: Named fractions cover most of it
      body: "left-half, right-third, band, bottom-third — the spans a deck actually says out loud."
    - head: Exact spans where no name fits
      body: "cols: {from: 7, to: 12} indexes the same twelve, half-open, and rows: takes the same form."
    - head: A region the brand keeps clear
      body: A conformed template's logo wedge is laid over these bars as its real polygon, and any
        placement intruding on it fails the build. The base theme reserves nothing, so none is drawn.
---
background: inverse
kicker: PART 3 OF 4
title: Spec
subtitle: A deck is a document you can read, diff, and hand to an assistant.
section: Spec
notes: Act three — the spec format and the escape hatch.
---
kicker: SPEC
title: A real file, rendered as itself
subtitle: doc-card places a markdown source as a picture — not a retyped copy
section: Spec
notes: 'This card is docs/qa.md''s own opening lines, screenshotted through headless

  Chrome and placed by place_panel. Edit the source file and the next build

  changes with it; nothing here is retyped prose.

  '
place:
- at: {cols: full}
  document:
    source: ../docs/qa.md
    lines: '1-9'
    max_width: 1500
---
kicker: SPEC
title: When the spec is not enough
subtitle: 'extends: points at a Python module that registers components by name'
section: Spec
notes: 'Every body on this deck — the point lists, the swatches, the grid, this code

  card — is a component that ships. `extends:` remains for the shape only one deck

  wants; the compiler hands a deck-local component the same rectangle and theme.

  '
place:
- at: {cols: full}
  split:
  - code:
      heading: my_components.py
      accent: ['@component']
      lines:
      - from deckwright.layouts.components import component
      - ''
      - '@component("org-chart")'
      - 'def org_chart(ctx):'
      - '    for node in ctx.body["nodes"]:'
      - '        rrect(ctx.slide, ..., ctx.color("surface"))'
  - callouts:
      heading: when to reach for it
      items:
      - head: One deck needs one shape
        body: "A diagram only this deck wants is ten lines beside it, not a feature request."
      - head: Full access to the theme
        body: "A deck-local component reads the same palette, ramp and grid the built-ins use."
      - head: Nothing is a special case
        body: "Built-ins and deck-local components resolve through one registry."
---
kicker: SPEC
title: Every build leaves a record
subtitle: A manifest of what the build meant to place, beside the .pptx
section: Spec
notes: 'This is the piece that makes the next phase possible. Render the deck to PDF,

  extract the text, diff it against the manifest — text that vanished overflowed.

  Panel text is marked as an image and excluded, because a PDF extractor cannot

  see it; that gets checked in the browser instead.

  '
place:
- at: {cols: full}
  split:
  - code:
      heading: recorded per slide
      lines:
      - 'shape_id, name, box (inches)'
      - 'text + font size'
      - 'foreground / background'
      - 'rendered: native | image'
      - 'animation groups'
      - 'slide_w, slide_h, theme_path'
  - callouts:
      heading: what it buys
      items:
      - head: Overflow becomes detectable
        body: "Compare the text the build intended against the text that survived the render."
      - head: Geometry becomes checkable
        body: "Off-slide shapes, overlaps and reserved-region intrusions are box arithmetic."
      - head: Hand-edits stay possible
        body: "Shape ids and names are what a surgical edit to a delivered deck needs."
---
kicker: SPEC
title: Bullets join the vocabulary
subtitle: The third body component, exercised for the first time in this deck
section: Spec
notes: 'callouts and stats have carried every body slide so far. bullets is the plain

  case — a heading, N columns, one bullet per item — and it guards its own

  overflow the same way its siblings do.

  '
place:
- at: {cols: full}
  bullets:
    heading: What ships today
    columns: 2
    items:
    - Callout lists
    - Stat tiles
    - Bullet columns
    - Native charts
    - A manifest per build
    - The Python escape hatch
