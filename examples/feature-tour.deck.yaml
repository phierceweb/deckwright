background: inverse
kicker: PART 4 OF 4
title: QA
subtitle: The build checks its own output before you ever open it.
section: QA
notes: Act four — the QA layer, built after this deck's first cut.
---
kicker: QA
title: What the checker catches
subtitle: Every check reads the manifest the build already writes — no second source of truth
section: QA
notes: 'Run as `deckwright qa <deck>.pptx`. The manifest records what the build intended;

  the checks compare that against the geometry and, for overflow, against a real render.

  '
animate: one_at_a_time
place:
- at: {cols: full}
  callouts:
    items:
    - head: Off-slide and safe-zone
      body: Shapes past the edge, or intruding on the logo wedge, as polygon arithmetic.
    - head: Typography floors
      body: Any run below the theme's minimum point size, wherever it came from.
    - head: Contrast
      body: WCAG AA ratios computed per run from the colours actually applied.
    - head: Overflow
      body: The text the build intended, diffed against the text that survived a render.
---
kicker: QA
title: This deck, checked
subtitle: The numbers below are this build's own QA run, not an illustration
section: QA
notes: 'Zero findings is what the built-in palette earns by construction: its weakest

  accent measures 6.0:1 on the page, well past the 4.5:1 AA minimum, because every

  pair is contrast-checked when the theme loads. Bind a real brand onto a template

  and this number moves — an accent chosen to look right as a fill is often below

  the bar as text, and that is exactly the finding this layer exists to surface.

  '
place:
- at: {cols: full}
  stats:
    items:
    - value: '29'
      label: slides compiled
    - value: '181'
      label: shapes recorded
    - value: '128'
      label: carrying text
    - value: '0'
      label: findings
    caption: A clean run is not a good deck — the next slide is what these checks cannot see.
---
kicker: QA
title: What it structurally cannot catch
subtitle: The checks that would need eyes, and are therefore still yours
section: QA
notes: 'This slide exists because a green check is the most dangerous thing a tool can

  emit. Everything below is invisible to the manifest by construction.

  '
animate: one_at_a_time
place:
- at: {cols: full}
  callouts:
    items:
    - head: Whether it looks good
      body: Balance, rhythm, and emphasis are not expressible as box arithmetic.
    - head: Whether the words are right
      body: The checker compares intended text to rendered text — never to the truth.
    - head: What a picture contains
      body: A rendered panel is one opaque rectangle; its internals are unreadable.
    - head: How a build animates
      body: That the timing is well-formed, not that the reveal order makes sense.
---
kicker: QA
title: Geometry the components can now ask for
subtitle: A body that ends above the logo wedge is entitled to the width the wedge steals
section: QA
notes: 'The safe zone is a triangle, so a full-height body must clear its diagonal and

  loses 1.31in. A body that stops at 5.0in never reaches the wedge and keeps the

  full content width. Components now request the rect their real height earns.

  '
place:
- at: {cols: full}
  stats:
    items:
    - value: 12.10"
      label: content width, full grid
    - value: 10.79"
      label: what a full-height body keeps
    - value: 1.31"
      label: reclaimed by a shallow body
    - value: '3'
      label: components reporting their height
    caption: The component reports how tall it came out; the layout bounds it from that.
---
background: inverse
title: deckwright
notes: Close on the two commands that produced this deck.
place:
- at: {cols: full}
  bullets:
    items:
    - bin/run build <spec>.deck.yaml
    - bin/run render <deck>.pptx --contact-sheet
