# The design system with no brand behind it — every value here is the built-in
# default, documented in docs/theme.md. This file ships inside the package; to build
# against a brand, derive a theme instead of editing it:
#   deckwright conform templates/Brand.pptx --adopt brand
name: base

# Stated rather than defaulted, so a reader can see the shape a `scale:` block takes.
# Percents of the canvas: on a 13.333x7.5in slide these are 0.80in side margins, a
# 0.20in gutter, and a 5.40in content band starting 1.65in down.
scale:
  margin: {top: 5%, right: 6%, bottom: 6%, left: 6%}
  columns: 12
  gutter: 1.5%
  body_top: 22%

# Sizes are for a 7.5in canvas and scale with it. Never name a Microsoft-only face
# (Calibri, Aptos, Consolas): off Windows they substitute silently. See docs/theme.md.
type:
  face: Helvetica
  heading_face: Helvetica
  mono: Courier New
  ramp:
    caption:  {pt: 14}
    body:     {pt: 16}
    kicker:   {pt: 13}
    subtitle: {pt: 18}
    lead:     {pt: 20}
    head:     {pt: 22}
    stat:     {pt: 34}
    title:    {pt: 34}
    display:  {pt: 46}
    hero:     {pt: 54}

motion:
  stagger_ms: 80
  transition: {kind: fade, speed: fast}
